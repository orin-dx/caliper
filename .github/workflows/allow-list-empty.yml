name: Allow-list empty

# scripts/equivalence-allow.json lists the differences one pull request means to make, so the Equivalence job can pass
# it. Once the pull request merges they are no longer differences, and an entry left on main hides the same kind of
# difference from every pull request after it (docs/parity.md). main's list must be empty.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  allow-list-empty:
    name: Allow-list empty
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/equivalence.py --require-empty-allow
