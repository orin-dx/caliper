name: Bench runners

# Caliper's wall time on the parity corpora on GitHub's own runners (2-4 vCPU, a cold disk), and the share of parse time
# a byte-scan prefilter could skip there. By hand only: the numbers vary by runner, so they inform a decision, not a gate.
on:
  workflow_dispatch:
    inputs:
      dependencies:
        description: Corpora to install and also time with --load-dependencies (space-separated, e.g. "shadcn"); empty skips
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  bench:
    name: Bench (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: rust
        run: echo "version=$(sed -n 's/^rust = "\(.*\)"/\1/p' .prototools)" >> "$GITHUB_OUTPUT"
      - uses: orin-dx/actions/setup-rust@2521888266780dabc7f5fd4c32b02d6ab82849db # v1.1
        with:
          toolchain: ${{ steps.rust.outputs.version }}
      - name: Install hyperfine
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install hyperfine; else sudo apt-get install -y hyperfine; fi
          hyperfine --version
      - name: Build
        run: |
          cargo build --release --locked -p caliper-docgen
          cargo build --release --locked -p caliper-docgen-core --features probe --example skippable_probe
      - name: Fetch the corpora
        run: python3 scripts/parity.py setup --no-install
      # Only the corpora named in the input: --load-dependencies reads their node_modules.
      - if: ${{ inputs.dependencies != '' }}
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true
      - if: ${{ inputs.dependencies != '' }}
        env:
          CORPORA: ${{ inputs.dependencies }}
        run: |
          args=()
          for name in $CORPORA; do args+=(--corpus "$name"); done
          python3 scripts/parity.py setup "${args[@]}"
      - name: Measure
        env:
          CORPORA: ${{ inputs.dependencies }}
        run: >-
          python3 scripts/bench-runners.py --bin target/release/caliper-docgen
          --probe target/release/examples/skippable_probe --dependencies $CORPORA
          --out bench.json --markdown bench.md
      - if: always()
        run: cat bench.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-${{ matrix.os }}
          path: |
            bench.json
            bench.md
