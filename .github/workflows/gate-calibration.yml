name: Gate calibration (scratch)

# Throwaway: A/A noise of the proposed speed+RSS gate. Never merged.
on:
  push:
    branches:
      - scratch/gate-calibration
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: rust
        run: echo "version=$(sed -n 's/^rust = "\(.*\)"/\1/p' .prototools)" >> "$GITHUB_OUTPUT"
      - uses: orin-dx/actions/setup-rust@2521888266780dabc7f5fd4c32b02d6ab82849db # v1.1
        with:
          toolchain: ${{ steps.rust.outputs.version }}
      - run: cargo build --release --locked -p caliper-docgen
      - name: Machine
        run: |
          lscpu | grep -E 'Model name|^CPU\(s\)|MHz|L3|Thread|Socket' || true
          free -m
          uname -a
      - name: Fetch the pinned corpora
        run: |
          python3 - <<'EOF'
          import json, os, sys
          sys.path.insert(0, 'scripts')
          import scorecard
          dirs = {c['name']: scorecard.fetch(c, '.scorecard/corpora') for c in scorecard.CORPORA}
          json.dump({k: os.path.abspath(v) for k, v in dirs.items()}, open('srcs.json', 'w'))
          print(dirs)
          EOF
      - name: A/A, 20 trials of 15 interleaved runs per side
        run: python3 scripts/aa.py target/release/caliper-docgen . aa-ci.json --srcs srcs.json --no-deps
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aa-ci
          path: aa-ci.json
          if-no-files-found: ignore
