# https://moonrepo.dev/docs/config/tasks
$schema: "https://moonrepo.dev/schemas/tasks.json"

fileGroups:
  sources:
    - "src/**/*"
  tests:
    - "tests/**/*"
    - "**/*.test.*"
    - "**/*.spec.*"
  configs:
    - "*.config.*"
    - "*.json"

tasks:
  fmt-check:
    command: cargo fmt --check
    options:
      runFromWorkspaceRoot: true
      cache: false

  lint:
    command: cargo clippy --workspace --exclude caliper-docgen-napi --locked -- -D warnings
    options:
      runFromWorkspaceRoot: true
      cache: false

  typos:
    command: typos
    options:
      runFromWorkspaceRoot: true
      cache: false

  deny:
    command: cargo deny check
    options:
      runFromWorkspaceRoot: true
      cache: false

  test:
    command: cargo nextest run --workspace --exclude caliper-docgen-napi --locked
    options:
      runFromWorkspaceRoot: true
      cache: false

  bench:
    command: cargo bench --workspace --exclude caliper-docgen-napi
    options:
      runFromWorkspaceRoot: true
      cache: false

  coverage:
    command: cargo llvm-cov nextest --workspace --exclude caliper-docgen-napi --locked --html --open
    options:
      runFromWorkspaceRoot: true
      cache: false
