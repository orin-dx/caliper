[package]
name = "caliper-docgen-semantic"
description = "TypeScript 7.1 checker backend for caliper-docgen: asks the built-in checker (tsrs) for each component's props"
version = "0.5.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
caliper-docgen-core       = { path = "../core", version = "0.11.0" }
tokio                     = { workspace = true, features = ["time", "rt", "sync"] }
serde.workspace           = true
serde_json                = { workspace = true, features = ["raw_value"] }
camino.workspace          = true
tracing.workspace         = true
rustc-hash.workspace      = true
tsrs_api.workspace        = true
tsrs_vfs.workspace        = true
tsrs_core.workspace       = true
rmp-serde.workspace       = true
xxhash-rust.workspace     = true

[dev-dependencies]
tempfile.workspace        = true
insta.workspace           = true
# The native binding's allocator, so the gate harness measures memory as the addon's process holds it.
mimalloc                  = { version = "0.1", default-features = false }
