[package]
name = "caliper-docgen-napi"
version = "0.10.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
caliper-docgen-core = { path = "../core", version = "0.10.0" }
caliper-docgen-semantic = { path = "../semantic", version = "0.4.0" }
# napi9: `node_api_get_module_file_name`, where the addon finds the tsrs installed beside it (Node 18.17 and later).
napi = { workspace = true, features = ["tokio_rt", "napi9"] }
napi-derive.workspace  = true
dashmap.workspace      = true
camino.workspace       = true
compact_str.workspace  = true
tokio.workspace        = true
serde_json.workspace   = true
percent-encoding       = "2.3"
mimalloc              = { version = "0.1", default-features = false }

[build-dependencies]
napi-build = "2"
