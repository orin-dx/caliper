language: rust

tasks:
  build:
    command: cargo build -p caliper-docgen-core
    options:
      runFromWorkspaceRoot: true
    inputs:
      - "src/**/*"
      - "Cargo.toml"

  test:
    command: cargo nextest run -p caliper-docgen-core --locked
    options:
      runFromWorkspaceRoot: true
    inputs:
      - "src/**/*"
      - "tests/**/*"
      - "Cargo.toml"

  lint:
    command: cargo clippy -p caliper-docgen-core --locked -- -D warnings
    options:
      runFromWorkspaceRoot: true
    inputs:
      - "src/**/*"
      - "Cargo.toml"
