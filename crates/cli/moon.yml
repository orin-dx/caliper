language: rust

tasks:
  build:
    command: cargo build -p caliper-docgen
    deps:
      - "core:build"
    options:
      runFromWorkspaceRoot: true
    inputs:
      - "src/**/*"
      - "Cargo.toml"

  test:
    command: cargo nextest run -p caliper-docgen --locked
    deps:
      - "core:build"
    options:
      runFromWorkspaceRoot: true
    inputs:
      - "src/**/*"
      - "tests/**/*"
      - "Cargo.toml"

  lint:
    command: cargo clippy -p caliper-docgen --locked -- -D warnings
    deps:
      - "core:build"
    options:
      runFromWorkspaceRoot: true
    inputs:
      - "src/**/*"
      - "Cargo.toml"
