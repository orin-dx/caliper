[package]
name = "caliper-docgen"
description = "Fast React prop extraction — CLI"
version = "0.3.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/caliper-docgen"
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[[bin]]
name = "caliper-docgen"
path = "src/main.rs"

[dependencies]
caliper-docgen-core = { path = "../core", version = "0.3.0" }
clap.workspace            = true
clap_complete.workspace   = true
miette                    = { workspace = true, features = ["fancy"] }
indicatif.workspace       = true
tracing.workspace         = true
tracing-subscriber.workspace = true
owo-colors.workspace      = true
watchexec.workspace       = true
tokio.workspace           = true
serde.workspace           = true
serde_json.workspace      = true
camino.workspace          = true
mimalloc.workspace        = true
comfy-table               = "8.0"
crossterm                 = "0.29"
watchexec-signals         = "5"

[target.'cfg(unix)'.dependencies]
rustix                    = { version = "1", features = ["termios"] }

[dev-dependencies]
insta.workspace           = true
tempfile.workspace        = true
rstest.workspace          = true
trycmd.workspace          = true
rustix                    = { version = "1", features = ["pty", "termios"] }
