[workspace]
members = [
    "crates/core",
    "crates/binding",
    "crates/cli",
    "crates/tsc-client",
    "crates/semantic",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
authors = ["caliper-docgen contributors"]
license = "FSL-1.1-MIT"
repository = "https://github.com/orin-dx/caliper"
homepage = "https://orin-dx.com/tools/caliper/"
keywords = ["react", "docgen", "typescript", "oxc", "storybook"]
categories = ["development-tools", "command-line-utilities"]

# "deny" rather than "forbid": a member crate could locally #[allow(unsafe_code)]
# on a real FFI boundary if one ever needs it — none currently do (verified:
# zero `unsafe` usage across crates/core, crates/cli, crates/binding; napi-rs's
# #[napi] macros generate the FFI glue without user-visible unsafe).
[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
map_err_ignore = "deny"
let_underscore_must_use = "deny"

[workspace.dependencies]
# OXC — all main crates move in lockstep; resolver has separate versioning
oxc_allocator     = "0.155"
oxc_parser        = "0.155"
oxc_ast           = "0.155"
oxc_ast_visit     = "0.155"
oxc_span          = "0.155"
oxc_str           = "0.155"
oxc_syntax        = "0.155"
oxc_resolver      = "11"

# Core data
compact_str       = { version = "0.10", features = ["serde"] }
rustc-hash        = "2.1"
dashmap           = "6.1"
arc-swap          = "1.9"
camino            = { version = "1.2", features = ["serde1"] }

# Serde
serde             = { version = "1.0", features = ["derive", "rc"] }
serde_json        = "1.0"
json-strip-comments = "3.1"
rmp-serde         = "1.3"

# Error handling
miette            = "7.6"

# Parallelism
rayon             = "1.12"
mimalloc          = "0.1"
tokio             = { version = "1.52", features = ["rt-multi-thread", "process", "io-util", "sync", "macros"] }

# File system
ignore            = "0.4"

# CLI
clap              = { version = "4.6", features = ["derive", "env", "wrap_help"] }
clap_complete     = "4.6"
indicatif         = "0.18"
tracing           = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
owo-colors        = "4.3"
watchexec         = "8.2"

# NAPI (3.x series)
napi              = { version = "3", features = ["napi4"] }
napi-derive       = "3"

# Dev
criterion         = "0.8"
insta             = { version = "1.48", features = ["json", "redactions"] }
tempfile          = "3.20"
rstest            = "0.28"
trycmd            = "1.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
debug = true
