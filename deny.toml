[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "FSL-1.1-MIT", # this workspace's own crates
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",  # unicode-ident
    "Zlib",         # foldhash (via simd-json → oxc_resolver)
    "CC0-1.0",      # notify (via watchexec)
    "BSL-1.0",      # xxhash-rust (via tsrs_core): permissive; attribution only in source form
    "Unicode-DFS-2016", # unicode-id-start 1.1.2, which tsrs_core pins: permissive, the Unicode data license
]

[bans]
multiple-versions = "warn"
# No skips: the duplicate oxc crate family these covered came in through
# oxc_module_lexer, which pinned 0.38.x against the main family's 0.135.x.
# That dependency is gone, and cargo-deny now reports every one of those
# skips as unnecessary.
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
